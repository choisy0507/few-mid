pan></text><rect x="990" y="381" width="292" height="147" rx="8" fill="#ECEEE4" stroke="#D7DACF"/><text x="1136" y="461.5" font-size="19" fill="#263D32" text-anchor="middle" font-weight="400"><tspan x="1136" dy="0">상세 설명 + 관찰 질문</tspan></text><rect x="990" y="543" width="292" height="82" rx="8" fill="#DEF19F" stroke="#D7DACF"/><text x="1136" y="591.0" font-size="19" fill="#263D32" text-anchor="middle" font-weight="400"><tspan x="1136" dy="0">이 개념 안에서 비교</tspan></text><path d="M872 309 L949 309" stroke="#7D8F7D" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="430" y="607" font-size="21" fill="#657369" text-anchor="middle" font-weight="400"><tspan x="430" dy="0">1050px: 상세 패널 아래로 / 760px: 지도 블록 재구성</tspan></text><text x="700" y="692" font-size="19" fill="#657369" text-anchor="middle" font-weight="400"><tspan x="700" dy="0">유지: 전체 계열의 접근, 현재 선택, 유형 이름, 관계의 이유</tspan></text></svg>