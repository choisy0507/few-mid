<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7D8F7D"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK KR",sans-serif}</style><rect width="100%" height="100%" fill="#F6F5EF"/><rect x="25" y="100" width="245" height="130" rx="8" fill="#FBFBF8" stroke="#D7DACF"/><text x="43" y="145" font-size="21" fill="#263D32" text-anchor="start" font-weight="600"><tspan x="43" dy="0">01 OVERVIEW</tspan></text><text x="43" y="195" font-size="20" fill="#263D32" text-anchor="start" font-weight="400"><tspan x="43" dy="0">8계열과 정보 유형</tspan></text><path d="M271 164 L295 164" stroke="#7D8F7D" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="302" y="100" width="245" height="130" rx="8" fill="#DEF19F" stroke="#D7DACF"/><text x="320" y="145" font-size="21" fill="#263D32" text-anchor="start" font-weight="600"><tspan x="320" dy="0">02 SELECT</tspan></text><text x="320" y="195" font-size="20" fill="#263D32" text-anchor="start" font-weight="400"><tspan x="320" dy="0">Floral 선택</tspan></text><path d="M548 164 L572 164" stroke="#7D8F7D" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="579" y="100" width="245" height="130" rx="8" fill="#FBFBF8" stroke="#D7DACF"/><text x="597" y="145" font-size="21" fill="#263D32" text-anchor="start" font-weight="600"><tspan x="597" dy="0">03 EXPLORE</tspan></text><text x="597" y="195" font-size="20" fill="#263D32" text-anchor="start" font-weight="400"><tspan x="597" dy="0">Musk 노트 발견</tspan></text><path d="M825 164 L849 164" stroke="#7D8F7D" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="856" y="100" width="245" height="130" rx="8" fill="#FBFBF8" stroke="#D7DACF"/><text x="874" y="145" font-size="21" fill="#263D32" text-anchor="start" font-weight="600"><tspan x="874" dy="0">04 COMPARE</tspan></text><text x="874" y="195" font-size="20" fill="#263D32" text-anchor="start" font-weight="400"><tspan x="874" dy="0">Musk 안에서 비교</tspan></text><path d="M1102 164 L1126 164" stroke="#7D8F7D" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="1133" y="100" width="245" height="130" rx="8" fill="#FBFBF8" stroke="#D7DACF"/><text x="1151" y="145" font-size="21" fill="#263D32" text-anchor="start" font-weight="600"><tspan x="1151" dy="0">05 RETURN</tspan></text><text x="1151" y="195" font-size="20" fill="#263D32" text-anchor="start" font-weight="400"><tspan x="1151" dy="0">같은 위치로 복귀</tspan></text><path d="M1255 232V342H417V241" fill="none" stroke="#899978" stroke-width="2" marker-end="url(#a)"/><text x="790" y="332" font-size="20" fill="#657369" text-anchor="middle" font-weight="400"><tspan x="790" dy="0">다른 계열로도 언제든 이동</tspan></text><rect x="205" y="430" width="990" height="150" rx="8" fill="#E9EDDF" stroke="#D7DACF"/><text x="700" y="479" font-size="30" fill="#263D32" text-anchor="middle" font-weight="400"><tspan x="700" dy="0">선택하지 않은 7계열 = 맥락</tspan></text><text x="700" y="530" font-size="23" fill="#263D32" text-anchor="middle" font-weight="400"><tspan x="700" dy="0">세부를 읽는 동안에도 전체 방향과 현재 위치를 유지합니다.</tspan></text><text x="700" y="651" font-size="19" fill="#657369" text-anchor="middle" font-weight="400"><tspan x="700" dy="0">비교는 독립된 첫 입구가 아니라, 궁금한 개념에서 한 단계 더 들어가는 경험입니다.</tspan></text></svg>